# docker-compose.yml - local multi-container run (mirrors future K8s services)
version: '3.8'

services:
  backend:
    build: ./backend
    container_name: quizarena-backend
    ports:
      - "5000:5000"
    environment:
      - PORT=5000
      - NODE_ENV=production
      - DB_PATH=/app/src/database/quizarena.db
      - JWT_SECRET=change_this_in_production
      - JWT_EXPIRES_IN=7d
      - CLIENT_URL=http://localhost:5173
      - ADMIN_EMAIL=admin@quizarena.com
      - ADMIN_PASSWORD=Admin@123
    volumes:
      - quizarena-db:/app/src/database

  frontend:
    build: ./frontend
    container_name: quizarena-frontend
    ports:
      - "5173:80"
    depends_on:
      - backend

volumes:
  quizarena-db:
